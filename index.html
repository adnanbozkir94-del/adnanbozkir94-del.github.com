<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LigPro | Canlı Veri Merkezi</title>
    <style>
        :root {
            --ana-sari: #fedd00;
            --arka-plan: #050505;
            --kart: #111111;
            --yazi: #ffffff;
            --canli-yesil: #00ff88;
        }

        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: var(--arka-plan); color: var(--yazi); }
        header { background: #000; padding: 20px; text-align: center; border-bottom: 4px solid var(--ana-sari); position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 2.5rem; font-weight: 900; margin: 0; }
        .logo span { color: var(--ana-sari); }

        .container { max-width: 1200px; margin: 20px auto; padding: 15px; display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 25px; }

        .league-card { background: var(--kart); border-radius: 12px; padding: 15px; border-left: 4px solid var(--ana-sari); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .league-title { font-size: 1.2rem; color: var(--ana-sari); margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; font-weight: bold; }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 8px; background: #1a1a1a; font-size: 10px; color: #666; text-transform: uppercase; }
        td { padding: 10px 8px; border-bottom: 1px solid #222; font-size: 13px; }

        .pts { font-weight: bold; color: var(--canli-yesil); text-align: right; }
        .loading { grid-column: 1 / -1; text-align: center; padding: 100px; font-size: 1.5rem; color: var(--ana-sari); }
    </style>
</head>
<body>

<header><h1 class="logo">LIG<span>PRO</span></h1></header>

<div id="league-container" class="container">
    <div class="loading">LigPro Verileri Canlı Olarak Hazırlanıyor...</div>
</div>

<script>
    // Kullanıcının sağladığı API anahtarı
    const API_KEY = 'fc3b335eb63141b9b63d54cefe1e794a'; 

    // Çekilecek liglerin listesi (Premier League, La Liga, Serie A, Bundesliga, Ligue 1)
    const codes = ['PL', 'PD', 'SA', 'BL1', 'FL1'];

    async function fetchStandings() {
        const container = document.getElementById('league-container');
        container.innerHTML = ''; 

        for (const code of codes) {
            try {
                const response = await fetch(`https://api.football-data.org/v4/competitions/${code}/standings`, {
                    headers: { 'X-Auth-Token': API_KEY }
                });
                const data = await response.json();
                const leagueName = data.competition.name;
                const standings = data.standings[0].table;

                let html = `
                    <div class="league-card">
                        <div class="league-title">${leagueName}</div>
                        <table>
                            <thead><tr><th>#</th><th>Takım</th><th>O</th><th>G</th><th style="text-align:right">P</th></tr></thead>
                            <tbody>`;

                standings.forEach(team => {
                    html += `
                        <tr>
                            <td>${team.position}</td>
                            <td>${team.team.shortName || team.team.name}</td>
                            <td>${team.playedGames}</td>
                            <td>${team.won}</td>
                            <td class="pts">${team.points}</td>
                        </tr>`;
                });

                html += `</tbody></table></div>`;
                container.innerHTML += html;

            } catch (err) {
                console.error("Veri çekme hatası:", err);
            }
        }
    }

    fetchStandings();
</script>

<footer>
    <p style="text-align:center; color:#444; padding: 40px;">LigPro Canlı Veri Sistemi © 2026</p>
</footer>

</body>
</html>
